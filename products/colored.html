<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colored Art - Sam's Art Corner</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>
    <header class="site-header">
        <h1 id="shop-name">Sam's Art Corner</h1>

        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="../about.html">About</a></li>
                <li><a href="../contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <table>
            <tr>
                <th><h2>Colored art of your oc/character</h2></th>
            </tr>
            <tr>
                <td>
                    <p align="center">
                        <img src="../art3.jpg" width="300" alt="Example of colored art">
                    </p>
                </td>
            </tr>
            <tr>
                <td>
                    <p>Price: 1000 PHP</p>
                    <p>A colored base of your character/oc!</p>
                </td>
            </tr>
        </table>

        <form>
            <h2>Order Enquiry</h2>

            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity" name="quantity" min="1" max="20" required>

            <fieldset>
                <legend>Delivery Method</legend>

                <label>
                    <input type="radio" name="delivery" value="delivery" required>
                    Home Delivery
                </label>

                <label>
                    <input type="radio" name="delivery" value="pickup">
                    Store Pickup
                </label>

                <label>
                    <input type="radio" name="delivery" value="meetup">
                    Meet-up
                </label>
            </fieldset>

            <p>Optional Extras:</p>

            <label>
                <input type="checkbox" name="extras" value="gift-wrapping">
                Gift Wrapping
            </label>

            <label>
                <input type="checkbox" name="extras" value="express-handling">
                Express Handling
            </label>

            <label>
                <input type="checkbox" name="extras" value="thank-you-card">
                Thank-you Card
            </label>

            <p>
                <label for="email">Contact Email:</label>
                <input type="email" id="email" name="email" required>
            </p>

            <button type="submit">Send Order Enquiry</button>
        </form>
    </main>

    <footer>
        <p id="copyright">&copy; 2026 Sam's Art Corner</p>
    </footer>

    <script src="../script.js"></script>
</body>
</html>
