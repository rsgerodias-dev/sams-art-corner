<html>

    <body>
    <head>
        <link rel="stylesheet" href="../style.css">
    </head>

        <table>

            <tr>
                <th><h1>Full/rendered art of your oc/character</h1></th>
            </tr>

            <tr>
                <td>
                    <p align="center">
                        <img src="art4.png" width="300" alt="What a full/rendered art would look like.">
                    </p>
                </td>
            </tr>

            <tr>
                <td>
                    <p>Price: 1500 PHP</p>
                    <p>A full/rendered art of your character/oc!</p>
                </td>
            </tr>

        </table>

        <form>

            <h2>Order Enquiry</h2>

            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity" name="quantity" min="1" max="20">

            <fieldset>
                <legend>Delivery Method</legend>

                <label>
                    <input type="radio" name="delivery" value="delivery">
                    Home Delivery
                </label>

                <label>
                    <input type="radio" name="delivery" value="pickup">
                    Store Pickup
                </label>

                <label>
                    <input type="radio" name="delivery" value="meetup">
                    Meet-up
                </label>

            </fieldset>

            <p>Optional Extras:</p>

            <label>
                <input type="checkbox" name="extras" value="gift-wrapping">
                Gift Wrapping
            </label>

            <label>
                <input type="checkbox" name="extras" value="express-handling">
                Express Handling
            </label>

            <label>
                <input type="checkbox" name="extras" value="thank-you-card">
                Thank-you Card
            </label>

            <br><br>

            <label for="email">Contact Email:</label>
            <input type="email" id="email" name="email" required>

            <button type="submit">Send Order Enquiry</button>

        </form>

    </body>

</html>
